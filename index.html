<!doctype html>
<html lang="en">

    <meta name="description" content="Frank Anthony — Fullstack developer, frontend-heavy. Building on Solana, Monad, and Zama FHE. Based in Lagos, Nigeria." />
    <title>Frank Anthony — Fullstack Developer</title>
    <!-- Anti-flash: apply saved theme before React renders -->
    <script>
      (function () {
        var stored = localStorage.getItem('portfolio-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
